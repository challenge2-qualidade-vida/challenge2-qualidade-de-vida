services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODELO: ${OLLAMA_MODELO:-qwen2.5:7b}
      OLLAMA_CONTEXTO: ${OLLAMA_CONTEXTO:-8192}
      OLLAMA_TEMPO_LIMITE: ${OLLAMA_TEMPO_LIMITE:-1800}
      MODELO_EMBEDDINGS: ${MODELO_EMBEDDINGS:-e5}
      DISPOSITIVO_EMBEDDINGS: cpu
      HF_HOME: /var/cache/huggingface
    volumes:
      - cache_modelos:/var/cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: economia
      POSTGRES_USER: economia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja o .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U economia -d economia"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_dados:/qdrant/storage
    mem_limit: 1g
    restart: unless-stopped

volumes:
  postgres_dados:
  qdrant_dados:
  cache_modelos:

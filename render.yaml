# Configuração para o Render (plano gratuito). Ver docs/desenvolvimento/12-publicacao.md.
services:
  - type: web
    name: economia
    runtime: docker
    plan: free
    branch: develop_gui
    healthCheckPath: /api/saude
    envVars:
      - key: LLM_PROVEDOR
        value: groq
      - key: LLM_API_KEY
        sync: false        # o valor é colado no painel do Render, nunca no repositório

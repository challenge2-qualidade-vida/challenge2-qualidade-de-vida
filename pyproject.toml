[project]
name = "economia"
version = "0.1.0"
description = "Backend da aplicação EconoMIA"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = ["fastapi (>=0.162.0,<0.163.0)", "uvicorn (>=0.54.0,<0.55.0)", "pymupdf (>=1.26,<2.0)"]
[tool.poetry]
packages = [
    { include = "economia", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-bdd (>=9.0.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "import-linter (>=2.15,<3.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]
